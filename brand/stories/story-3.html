<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story 3 — projects</title>
<link rel="stylesheet" href="story.css">
<style>
  .head { position: absolute; top: 240px; left: 80px; right: 80px; }
  h1 { margin-top: 40px; font-family: var(--display); font-weight: 800; font-size: 150px; line-height: .9; letter-spacing: -.06em; text-transform: uppercase; }
  h1 em { font-style: normal; color: var(--amber); }
  .sub { margin-top: 34px; font-size: 38px; line-height: 1.35; color: var(--muted); }
  .sub b { color: var(--fg); font-weight: 600; }

  /* Real project cards cropped from the site, stacked */
  .card { position: absolute; left: 90px; width: 900px; border-radius: 36px; overflow: hidden; border: 2px solid #2e3136;
          box-shadow: 0 40px 100px -20px rgba(0,0,0,.95); background: #111316; }
  .card div { width: 900px; height: 934px; background: url(assets/m-projects.png) no-repeat; background-size: 1013px auto; }
  .c1 { top: 800px; left: 30px; transform: scale(.78) rotate(-6deg); z-index: 1; height: 934px; }
  .c1 div { background-position: -48px -516px; }
  .c2 { top: 1110px; left: 170px; transform: scale(.78) rotate(5deg); z-index: 2; height: 934px; }
  .c2 div { background-position: -48px -1500px; }

  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; height: 640px; z-index: 3;
    background: linear-gradient(to bottom, transparent, var(--bg) 45%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 30px; padding-bottom: 300px;
  }
  .hint { font-family: var(--mono); font-size: 28px; color: var(--muted); }
</style>
</head>
<body>
  <div class="backdrop">
    <div class="glow" style="width:1300px;height:1300px;left:-120px;top:700px"></div>
  </div>

  <div class="layer">
    <div class="head">
      <span class="badge"><span class="dot"></span>LIVE</span>
      <h1>New site<br>is <em>live.</em></h1>
      <p class="sub">See what I've built — <b>4+ years</b>, real projects, one link.</p>
    </div>

    <div class="card c2"><div></div></div>
    <div class="card c1"><div></div></div>

    <div class="foot">
      <span class="cta">Visit mustafodev.uz
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </span>
      <span class="hint">mustafodev.</span>
    </div>
  </div>
</body>
</html>
